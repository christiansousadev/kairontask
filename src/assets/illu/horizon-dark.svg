<svg width="500" height="120" viewBox="0 0 500 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kaironHorizonArcDark" x1="60" y1="70" x2="440" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="30%" stop-color="#22d3ee" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#7c3aed" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="kaironOrbGlowDark" cx="50%" cy="62%" r="48%">
