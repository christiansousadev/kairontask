<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kaironGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="kaironAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="kaironGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366F1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Kairon Precision Stem -->
  <rect x="10" y="8" width="9" height="48" rx="4.5" fill="url(#kaironGradient)" filter="url(#kaironGlow)" />

  <!-- Upper Dynamic Chevron -->
  <path d="M23 34 L45 10 H54 L32 34 Z" fill="url(#kaironGradient)" />
  
  <!-- Lower Dynamic Chevron -->
  <path d="M28 30 L54 54 H45 L21 32 Z" fill="url(#kaironGradient)" opacity="0.95" />

  <!-- Central Kairos Temporal Core -->
  <polygon points="26,32 32,26 38,32 32,38" fill="url(#kaironAccent)" />
  <circle cx="32" cy="32" r="2" fill="#FFFFFF" opacity="0.9" />
</svg>
